[General]
DisplayServer=x11
Numlock=on

[Theme]
Current=ifos
CursorTheme=Adwaita
CursorSize=24

[Autologin]
User=ifos
Session=i3.desktop
Relogin=false

[X11]
# Keep the greeter off VT1 - archiso autologins root on tty1 as a rescue console.
MinimumVT=7

[Users]
HideShells=/usr/bin/nologin,/sbin/nologin
