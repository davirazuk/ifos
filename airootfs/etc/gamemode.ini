# ─────────────────────────────────────────────────────────────────────────────
#  GameMode, actually doing the things it was installed to do.
#
#  The launcher wraps every game in `gamemoderun`, and the README said that put
#  the game's scheduling and I/O priority above everything else. It did not.
#  GameMode ships with `renice=0` and `ioprio=0`, which mean "change nothing" -
#  so the only thing happening on any IFOS machine was the CPU governor and the
#  screensaver. On a four-core laptop with a browser open, that is most of the
#  difference: the game is competing on equal terms with thirty Firefox
#  processes for both the processor and the disk, and it loses often enough to
#  be felt as a stutter rather than as a lower frame rate.
#
#  All of it is given back the moment the game exits, which is why it can be on
#  for everybody without asking. Nothing here costs a machine anything while
#  nobody is playing.
# ─────────────────────────────────────────────────────────────────────────────

[general]
# How often the reaper thread checks for clients that have exited, in seconds.
# The default; here so it is visible that nothing is left running afterwards.
reaper_freq=5

# The processor at full speed for as long as the game is open. On a laptop the
# ondemand/schedutil governor ramps up *after* it notices load, which in a game
# is after the frame it was needed for.
desiredgov=performance

# On a hybrid laptop the integrated chip is not the one running the game, and
# holding it at full speed only costs battery and heat - which on these
# machines turns into the processor throttling itself, i.e. the opposite of
# what was wanted.
igpu_desiredgov=powersave
igpu_power_threshold=0.3

# SCHED_ISO does not exist in upstream kernels, and IFOS runs upstream kernels.
# Turning it on would only produce a failure in the log every time a game
# starts.
softrealtime=off

# Priority over everything else that is running. The value is negated and used
# as a nice value, so this is nice -10: the game wins against the browser, the
# file indexer and the update that started itself, and only against those - it
# is nowhere near the priority of anything the kernel needs.
#
# This requires the user to be in the `gamemode` group, which is why install-ifos
# adds them to it and ifos-update adds the accounts that predate this file.
# Without the group GameMode logs that it could not renice and carries on, so a
# machine that misses it is no worse off than before.
renice=10

# And the same for the disk, which is the half that actually shows up as a
# freeze rather than as a lower frame rate: a game loading a level while pacman
# writes a hundred packages behind it waits for the disk, not the processor. 1
# is best-effort, one step below real-time, which nothing here should ever ask
# for.
ioprio=1

# No screen blanking in the middle of a cutscene, or during anything played
# with a controller where the keyboard and mouse are not being touched at all.
inhibit_screensaver=1

# Split-lock detection stalls every core on the machine when a game does an
# unaligned atomic across a cache line, which several Windows games under
# Proton do constantly. The kernel's mitigation is right for a server and
# catastrophic here - it is measured in whole seconds of stall.
disable_splitlock=1
