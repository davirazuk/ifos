# ─────────────────────────────────────────────────────────────────────────────
#  Kernel tuning for the two things this machine is actually used for: games
#  and being an old computer.
# ─────────────────────────────────────────────────────────────────────────────

# Memory mappings a process may hold. The kernel default of 65530 is far below
# what modern games need through Proton and DXVK, which map an enormous number
# of small regions; a title that runs past it does not warn, it fails to start
# or crashes partway in, with nothing in the game's own logs to explain why.
# This is the value SteamOS and Fedora ship, and the one the Arch wiki gives for
# the same problem. The setting costs nothing when unused - it is a ceiling, not
# an allocation.
vm.max_map_count = 2147483642

# Swapping is much cheaper than the kernel assumes here, because zram makes the
# first 4 GiB of it compressed memory rather than disk (see
# /etc/systemd/zram-generator.conf). The stock value of 60 is tuned for swap
# that costs a disk seek, and it leaves a machine with 4 GiB of RAM refusing to
# use swap it could reach in microseconds, thrashing the page cache instead.
#
# 100 rather than the 180 some zram setups use: the disk swap file is still
# there underneath as overflow, so being too eager would eventually reach it.
vm.swappiness = 100
