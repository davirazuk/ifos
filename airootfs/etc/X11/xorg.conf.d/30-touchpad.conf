# ─────────────────────────────────────────────────────────────────────────────
#  Touchpad behaviour.
#
#  libinput ships with tapping turned off, so out of the box a touchpad only
#  clicks when you physically press it down - resting a finger on it does
#  nothing. Every laptop and phone people have used behaves the other way
#  round, so this reads as a broken touchpad rather than a setting.
#
#  Only the things that differ from libinput's defaults are set here, plus the
#  two-finger scrolling, which is worth pinning: without it a touchpad that
#  reports an edge-scroll capability can end up on edge scrolling instead.
#
#  This needs xf86-input-libinput installed to have any effect - it is what
#  provides the "libinput" driver named below.
# ─────────────────────────────────────────────────────────────────────────────

Section "InputClass"
    Identifier "IFOS touchpad"
    Driver "libinput"
    MatchIsTouchpad "on"

    # Tap to click. One finger is a left click, two a right click and three a
    # middle click, which is libinput's default mapping once tapping is on.
    Option "Tapping" "on"

    # Tap, then keep the finger down to drag - otherwise selecting text or
    # moving a window means holding the physical button the whole way.
    Option "TappingDrag" "on"

    # Two fingers scroll. The physical buttons keep their normal meaning: the
    # click method is left alone deliberately, so pressing the pad still works
    # exactly as it did before.
    Option "ScrollMethod" "twofinger"

    # Ignore the pad while typing, so the cursor does not jump into the middle
    # of a sentence when a palm brushes it.
    Option "DisableWhileTyping" "on"
EndSection
