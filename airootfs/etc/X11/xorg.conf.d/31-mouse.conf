# ─────────────────────────────────────────────────────────────────────────────
#  Mouse behaviour.
#
#  libinput's default acceleration profile is "adaptive": the faster you move
#  the mouse, the further the pointer goes for the same distance travelled. On
#  a desktop that is helpful. In a game it is the reason the camera feels
#  wrong - turning ninety degrees takes a different flick depending on how fast
#  you flicked, so nothing ever lands where you aimed and no sensitivity
#  setting inside the game can fix it, because the distortion happens before
#  the game sees the movement.
#
#  "flat" is one-to-one: the same hand movement always turns the camera the
#  same amount. It is what every game assumes, what Windows players mean when
#  they say they turned off "enhance pointer precision", and the reason a
#  mouse that feels fine on the desktop can feel broken in a game.
#
#  Touchpads are deliberately excluded. A touchpad has about ten centimetres of
#  travel and genuinely needs acceleration to cross a screen; its settings live
#  next door in 30-touchpad.conf and are untouched by this.
#
#  Not liked? One command, and it is remembered:
#
#      ifos-mouse --adaptive
#
#  and `ifos-mouse --flat` puts it back.
# ─────────────────────────────────────────────────────────────────────────────

Section "InputClass"
    Identifier "IFOS mouse"
    Driver "libinput"
    MatchIsPointer "on"
    MatchIsTouchpad "off"

    Option "AccelProfile" "flat"
EndSection
