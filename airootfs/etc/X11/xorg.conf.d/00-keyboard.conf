# Brazilian ABNT2 layout for the graphical session.
# Change with:  sudo localectl set-x11-keymap us
Section "InputClass"
    Identifier "system-keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "br"
    Option "XkbModel" "abnt2"
    Option "XkbVariant" ""
    Option "XkbOptions" ""
EndSection
