# IFOS — picom compositor
# i3 launches `picom -b`, which previously ran with no configuration at all.

backend = "glx";
vsync = true;
use-damage = true;

# ── Rounded corners ──────────────────────────────────────────────────────────
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "class_g = 'Polybar'",
    "class_g = 'i3-frame'"
];

# ── Shadows ──────────────────────────────────────────────────────────────────
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -12;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@"
];

# ── Fading ───────────────────────────────────────────────────────────────────
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

# ── Transparency ─────────────────────────────────────────────────────────────
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "92:class_g = 'Alacritty' && focused",
    "86:class_g = 'Alacritty' && !focused",
    "95:class_g = 'Polybar'"
];

# ── Misc ─────────────────────────────────────────────────────────────────────
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

wintypes:
{
    tooltip      = { fade = true; shadow = false; opacity = 0.95; focus = true; };
    dock         = { shadow = false; };
    dnd          = { shadow = false; };
    popup_menu   = { opacity = 0.96; };
    dropdown_menu = { opacity = 0.96; };
};
