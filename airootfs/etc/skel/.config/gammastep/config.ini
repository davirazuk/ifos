; ─────────────────────────────────────────────────────────────────────────────
;  Night light — warms the screen after sunset.
;
;  The location is written out rather than looked up. gammastep can ask a
;  geolocation service, but that needs geoclue running and a network, and this
;  is a school distribution: the machines are in Dourados, and a laptop with no
;  signal should still dim its screen at night. Coordinates are the campus.
;
;  Someone elsewhere only has to change the two numbers below.
;  Turn it on and off with Mod+N.
; ─────────────────────────────────────────────────────────────────────────────

[general]
; 6500K is daylight - no tint at all while the sun is up.
temp-day=6500
; 4000K rather than the usual 3400K. Deep amber looks dramatic in a screenshot
; and awful when you are actually reading, and someone finishing homework at
; midnight is reading.
temp-night=4000
; Ease between the two over a few minutes instead of stepping, so nobody
; notices it happening and goes looking for what broke.
fade=1
adjustment-method=randr
location-provider=manual

[manual]
; IFMS Campus Dourados, Mato Grosso do Sul.
lat=-22.2211
lon=-54.8056
