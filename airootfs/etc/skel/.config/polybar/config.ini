; ─────────────────────────────────────────────────────────────────────────────
;  IFOS — polybar
;  Modules that depend on optional hardware (battery, wifi, bluetooth) are
;  script-based so the bar still comes up cleanly on a desktop with no battery
;  or no wireless card, instead of logging errors and leaving a gap.
; ─────────────────────────────────────────────────────────────────────────────

[colors]
bg       = #1e1e2e
bg-alt   = #313244
fg       = #cdd6f4
fg-dim   = #6c7086
blue     = #89b4fa
mauve    = #cba6f7
green    = #a6e3a1
yellow   = #f9e2af
red      = #f38ba8
cyan     = #94e2d5
lavender = #b4befe

[bar/main]
monitor          =
width            = 100%
height           = 28
radius           = 0
background       = ${colors.bg}
foreground       = ${colors.fg}
line-size        = 2
padding-left     = 2
padding-right    = 2
module-margin    = 1
separator        = │
separator-foreground = ${colors.bg-alt}
font-0           = JetBrainsMono Nerd Font:size=10;2
font-1           = Font Awesome 6 Free:style=Solid:size=10;2
font-2           = Font Awesome 6 Brands:size=10;2
font-3           = Noto Color Emoji:scale=10;2
modules-left     = i3
modules-center   = date
modules-right    = network volume battery cpu memory bluetooth
tray-position    = right
tray-padding     = 4
cursor-click     = pointer
enable-ipc       = true
border-size      = 0

[module/i3]
type                       = internal/i3
format                     = <label-state> <label-mode>
index-sort                 = true
wrapping-scroll            = false
label-focused              = %index%
label-focused-foreground   = ${colors.blue}
label-focused-underline    = ${colors.blue}
label-focused-padding      = 2
label-unfocused            = %index%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding    = 2
label-visible              = %index%
label-visible-foreground   = ${colors.fg-dim}
label-visible-padding      = 2
label-urgent               = %index%
label-urgent-foreground    = ${colors.red}
label-urgent-padding       = 2

[module/date]
type                     = internal/date
interval                 = 5
date                     = %a %d %b
time                     = %H:%M
format-prefix            = "  "
format-prefix-foreground = ${colors.mauve}
label                    = %date%  %time%

[module/cpu]
type                     = internal/cpu
interval                 = 2
format-prefix            = " "
format-prefix-foreground = ${colors.green}
label                    = %percentage:2%%

[module/memory]
type                     = internal/memory
interval                 = 3
format-prefix            = " "
format-prefix-foreground = ${colors.blue}
label                    = %percentage_used:2%%

; Reports whichever interface is actually carrying traffic - wired or wireless -
; and says "offline" when nothing is up.
[module/network]
type              = custom/script
exec              = ~/.config/polybar/scripts/network.sh
interval          = 5
format-foreground = ${colors.cyan}
click-left        = nm-connection-editor

[module/volume]
type                     = internal/pulseaudio
format-volume-prefix     = "  "
format-volume-prefix-foreground = ${colors.yellow}
label-volume             = %percentage%%
format-muted-prefix      = "  "
format-muted-prefix-foreground = ${colors.fg-dim}
label-muted              = muted
label-muted-foreground   = ${colors.fg-dim}
click-right              = pavucontrol

; Prints nothing at all when the machine has no battery.
[module/battery]
type              = custom/script
exec              = ~/.config/polybar/scripts/battery.sh
interval          = 20
format-foreground = ${colors.green}

[module/bluetooth]
type              = custom/script
exec              = ~/.config/polybar/scripts/bluetooth.sh
interval          = 10
format-foreground = ${colors.mauve}
click-left        = blueman-manager
