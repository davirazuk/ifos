; ─────────────────────────────────────────────────────────────────────────────
;  IFOS — polybar
;
;  A bar of rounded pills in the IFOS green. Modules that depend on optional
;  hardware (battery, wifi, bluetooth) are script-based so the bar still comes
;  up cleanly on a desktop with no battery or no wireless card, instead of
;  logging errors and leaving a gap.
; ─────────────────────────────────────────────────────────────────────────────

; Only the colours that are still reachable by name. Everything a pill is drawn
; with has to be written as a literal hex where it is used: polybar's
; ${section.key} parser takes everything between the first ${ and the last } as
; one name, so a value holding a reference *and* a %{...} tag never resolves,
; and every pill is exactly that. ifos-theme substitutes hexes wherever they
; appear in the file, so the inlined ones still follow a theme change.
[colors]
bg        = #f210241d
surface   = #1b3a2e
fg        = #e8f5e9
fg-dim    = #7fa392

[bar/main]
; Filled in by launch.sh, which starts one bar per connected output. Empty
; means "whatever polybar considers primary", which is the single-screen case
; and the fallback if the monitor list cannot be read.
monitor          = ${env:MONITOR:}
monitor-strict   = false
; Flush and full width. i3 reserves the bar's height as a strut, so an offset
; only pushes the gap off-screen and the rounded corners never show - a clean
; edge-to-edge bar reads better than a floating one that is not really floating.
width            = 100%
; Set by ifos-scale through launch.sh: 32 on an ordinary screen, taller on a
; high-density one. A fixed 32 pixels on a 4K laptop panel is about four
; millimetres of bar, with text to match.
height           = ${env:IFOS_BAR_HEIGHT:32}
; Font sizes below are in points, and polybar turns points into pixels with
; this. Scaling the bar therefore means setting the DPI, not rewriting each
; font line - polybar does NOT expand ${env:...} inside font-N. It hands the
; literal string to the font parser, which fails, and then the whole bar exits:
; "Could not parse font". 0 means ask the X server, which is the old behaviour.
dpi              = ${env:IFOS_BAR_DPI:0}
offset-x         = 0
offset-y         = 0
radius           = 0
background       = ${colors.bg}
foreground       = ${colors.fg}
line-size        = 3
padding          = 1
module-margin    = 1
separator        =
separator-foreground = ${colors.surface}
; Font order matters twice over. Polybar tries them left to right for every
; character, so font-0 must be the text font; and `format-font` indices are
; 1-based - `format-font = 2` means font-1, not font-2.
;
; The icons in this file are Font Awesome 4.7 codepoints, which live in the
; basic private use area. Both fonts below carry that block: JetBrainsMono Nerd
; Font patches it in, and otf-font-awesome ships it natively. Two sources for
; the same glyph is deliberate - a codepoint no installed font has is drawn as
; a hollow box, and a bar full of boxes looks broken in a way blank space does
; not. The status scripts use the Material Design range instead, which only the
; Nerd Font has; they are already guarded by exec-if.
font-0           = JetBrainsMono Nerd Font:size=10;3
font-1           = JetBrainsMono Nerd Font:size=14;4
font-2           = Font Awesome 6 Free:style=Solid:size=10;3
font-3           = Noto Color Emoji:scale=10;3
; The rounded ends of the status pills, and nothing else. Its size is what
; decides how tall the pill looks: the glyph is drawn at its own size, not
; stretched to the bar, so a small one leaves a semicircle floating in the
; middle of a full-height block. 20pt fills a 32px bar; polybar scales it with
; the rest when `dpi` is set, so it follows a high-density screen on its own.
font-4           = JetBrainsMono Nerd Font:size=22;6
modules-left     = menu i3 xwindow
modules-center   = date
# media leads the right-hand cluster: a track name is far wider than an icon,
# and putting it among the fixed-width status icons would shove them sideways
# every time the song changed.
modules-right    = media network volume powerprofile battery cpu memory bluetooth power
; No tray. The only things that ever sat in it were nm-applet and
; blueman-applet, and the bar now has its own network and bluetooth modules -
; so the tray was showing a second wifi icon and a second bluetooth icon right
; next to them.
;
; Both applets are still started by i3 and still do their real work: the
; NetworkManager secret agent, the bluetooth pairing agent, and reconnecting
; paired devices. A status icon with nowhere to draw itself simply does not
; appear; nothing else about them changes.
;
; Want a tray back for some other application? Put these three lines back.
; tray-position  = right
; tray-padding   = 6
; tray-maxsize   = 18
cursor-click     = pointer
enable-ipc       = true
border-size      = 0
wm-restack       = i3

; ── The rounded pill ─────────────────────────────────────────────────────────
;  Every status module is drawn as a rounded block in the surface colour. There
;  is no `radius` for a module - polybar only rounds the bar itself - so the
;  ends are two half-circle glyphs from the Powerline Extra range, drawn in the
;  surface colour on the bar's own background.
;
;  Order matters in both. Left: switch to the cap font, paint the half-circle,
;  come back to the text font, and only then turn the background on - otherwise
;  the cap is drawn on top of the block it is supposed to be starting. Right:
;  background off first, for the same reason in reverse.
;
;      left   %{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e}
;      right  %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}
;
;  %{T5} is font-4: the font indices in format strings are 1-based. They are
;  written out in every module rather than referenced from one place: polybar's
;  ${section.key} parser takes everything between the first ${ and the last } as
;  the name, so a value holding a reference *and* a %{...} tag never resolves.
[module/menu]
type              = custom/text
format            = "%{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e}%{F#7ed957}    %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}"
; 1-based: this is font-1, the size-14 JetBrainsMono, so the launcher button is
; drawn larger than the status icons beside it. It is the one thing on the bar
; people are told to click.
format-font       = 2
click-left        = ifos-launcher
click-right       = rofi -show drun

[module/i3]
type                       = internal/i3
format                     = <label-state> <label-mode>
index-sort                 = true
wrapping-scroll            = false
enable-click               = true
enable-scroll              = true
; Each bar lists only the workspaces on its own monitor, rather than every bar
; listing every workspace and clicking a number on the wrong one throwing that
; workspace across to the other screen. This does nothing on its own: it only
; means something because launch.sh now starts one bar per connected output.
pin-workspaces             = true

; The workspace chips are pills too, for the same reason the status modules
; are: a hard-edged green rectangle beside a row of rounded ones reads as a
; rendering fault rather than as a highlight. There is no radius for a label
; either, so the ends are the same two glyphs - which is also why the padding
; and background keys are gone, both live inside the label now.
label-mode                 = "%{T5}%{F#00a86b}%{T-}%{B#00a86b}%{F#10241d} %mode% %{B-}%{T5}%{F#00a86b}%{T-}%{F-}"
label-mode-padding         = 0

label-focused              = "%{T5}%{F#00a86b}%{T-}%{B#00a86b}%{F#10241d} %index% %{B-}%{T5}%{F#00a86b}%{T-}%{F-}"
label-focused-padding      = 0

; Not focused, not open: dim text and nothing else. A pill on every number
; would be eight identical blocks saying nothing about which one you are on.
label-unfocused            = %index%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding    = 1

; Open, but on the other screen. Filled in the surface colour rather than the
; accent, so it is visibly not the one you are looking at.
label-visible              = "%{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e}%{F#7ed957} %index% %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}"
label-visible-padding      = 0

label-urgent               = "%{T5}%{F#f38ba8}%{T-}%{B#f38ba8}%{F#10241d} %index% %{B-}%{T5}%{F#f38ba8}%{T-}%{F-}"
label-urgent-padding       = 0

; What is focused. i3 tabs new windows, so the tab bar names them - but a
; single window on a workspace has no tab bar at all, and a fullscreen one
; covers it, so this is the only place that says what you are looking at.
; Truncated rather than allowed to push the clock off centre.
[module/xwindow]
type             = internal/xwindow
label            = %title%
label-maxlen     = 48
label-empty      =
label-foreground = ${colors.fg-dim}

[module/date]
type                     = internal/date
interval                 = 5
date                     = %a %d %b
time                     = %H:%M
format-prefix            = "%{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e}%{F#7ed957}    "
format-suffix            = " %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}"
label                    = %date%  %{F#e8f5e9}%time%%{F-}
label-foreground         = ${colors.fg-dim}

[module/cpu]
type                     = internal/cpu
interval                 = 2
format-prefix            = "%{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e}%{F#7ed957}   "
format-suffix            = " %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}"
label                    = %percentage:2%%
label-foreground         = ${colors.fg-dim}

[module/memory]
type                     = internal/memory
interval                 = 3
format-prefix            = "%{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e}%{F#7ed957}   "
format-suffix            = " %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}"
label                    = %percentage_used:2%%
label-foreground         = ${colors.fg-dim}

; Reports whichever interface is actually carrying traffic - wired or wireless -
; and says "offline" when nothing is up.
[module/network]
type              = custom/script
exec              = ~/.config/polybar/scripts/network.sh
interval          = 5
; The script prints its own icon and colours, so the pill is all the config
; adds: an opening cap and a closing one around whatever comes back.
format-prefix     = "%{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e} "
format-suffix     = " %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}"
format-foreground = ${colors.fg-dim}
# Pick a network and join it. The editor is still one entry inside the menu,
# for the rare case that someone needs to edit a profile rather than connect.
click-left        = ~/.config/rofi/network-menu.sh
click-right       = nm-connection-editor

[module/volume]
type                     = internal/pulseaudio
; This module has no plain `format` - it has one per state - so the pill has to
; be built twice, or it vanishes the moment the sound is muted.
format-volume-prefix     = "%{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e}%{F#7ed957}   "
format-volume-suffix     = " %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}"
label-volume             = %percentage%%
label-volume-foreground  = ${colors.fg-dim}
format-muted-prefix      = "%{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e}%{F#f38ba8}   "
format-muted-suffix      = " %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}"
label-muted              = mudo
label-muted-foreground   = ${colors.fg-dim}
; Clicking a speaker icon mutes it. Set explicitly rather than left to whatever
; the module does by default, and through pamixer, which the profile installs -
; so this does not depend on pactl arriving as somebody else's dependency.
click-left               = pamixer -t
click-right              = pavucontrol

; Prints nothing at all when the machine has no battery.
[module/battery]
type              = custom/script
exec              = ~/.config/polybar/scripts/battery.sh
# A desktop has no battery and never will; the script already printed nothing
# there, but it was still being started three times a minute to do it.
exec-if           = test -n "$(ls -d /sys/class/power_supply/BAT* 2>/dev/null)"
interval          = 20
format-prefix     = "%{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e} "
format-suffix     = " %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}"
format-foreground = ${colors.fg-dim}

# What is playing. Left click pauses, the scroll wheel skips - the module is
# absent entirely when nothing is playing, so this costs no bar space when it
# has nothing to show.
[module/media]
type              = custom/script
# tail, not interval: the script blocks on playerctl --follow and prints only
# when something changes. Polling this every two seconds started playerctl
# around ninety times a minute on a machine usually playing nothing.
exec              = ~/.config/polybar/scripts/media.sh
tail              = true
# Nothing to follow without playerctl, so the script is never started.
exec-if           = command -v playerctl
format-prefix     = "%{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e} "
format-suffix     = " %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}"
format-foreground = ${colors.fg-dim}
click-left        = ~/.config/polybar/scripts/media.sh toggle
scroll-up         = ~/.config/polybar/scripts/media.sh next
scroll-down       = ~/.config/polybar/scripts/media.sh prev

# The power profile. Click cycles it.
[module/powerprofile]
type              = custom/script
exec              = ~/.config/polybar/scripts/power-profile.sh
click-left        = ~/.config/polybar/scripts/power-profile.sh --cycle
# tail, not interval. Polled every thirty seconds, the bar kept showing the old
# profile for up to half a minute after a click - long enough to click again
# thinking nothing had happened. The script now listens for the daemon's
# PropertiesChanged signal, which carries the new profile with it, so the label
# changes about as fast as the click itself.
exec-if           = command -v powerprofilesctl
tail              = true
format-prefix     = "%{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e} "
format-suffix     = " %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}"
format-foreground = ${colors.fg-dim}

[module/bluetooth]
type              = custom/script
exec              = ~/.config/polybar/scripts/bluetooth.sh
# A desktop with no bluetooth radio was still running bluetoothctl six times a
# minute to be told the same thing. Nothing to poll if there is no adapter.
exec-if           = test -n "$(ls -A /sys/class/bluetooth 2>/dev/null)"
interval          = 15
format-prefix     = "%{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e} "
format-suffix     = " %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}"
format-foreground = ${colors.fg-dim}
# Paired devices, connecting on Enter. blueman is inside the menu for pairing
# something new, which needs a PIN agent this has no business reimplementing.
click-left        = ~/.config/rofi/bluetooth-menu.sh
click-right       = blueman-manager

[module/power]
type              = custom/text
format            = "%{T5}%{F#1b3a2e}%{T-}%{B#1b3a2e}%{F#f38ba8}    %{B-}%{T5}%{F#1b3a2e}%{T-}%{F-}"
click-left        = ~/.config/rofi/powermenu.sh
