# ─────────────────────────────────────────────────────────────────────────────
#  The IFOS palette for Qt applications.
#
#  Without this, Qt programs came up in Fusion's default light palette in the
#  middle of a dark green desktop - the shipped qt5ct.conf said
#  custom_palette=false, so the configuration that was there did nothing at
#  all. VLC, qBittorrent and OBS are all Qt.
#
#  Every colour here comes from the IFOS palette, so `ifos-theme` repaints
#  this file along with everything else.
# ─────────────────────────────────────────────────────────────────────────────
